<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IIIF Book Viewer</title>
    <style>
        body {
            margin: 0;
            background-color: #1e1e1e;
            font-family: sans-serif;
        }
        #viewer-container {
            width: 100vw;
            height: 100vh;
            color: white;
        }
    </style>
    <!-- Load OpenSeadragon via CDN (No React/Build tools needed) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/5.0.1/openseadragon.min.js"></script>
</head>
<body>

    <!-- The container where the scrolling book will render -->
    <div id="viewer-container"></div>

    <script>

        // Target the static manifest generated by your Git pipeline
        const manifestUrl = "https://ericvanderlinden.github.io/resources/retro/heinsius/heinsius_01_GS158/public/iiif//manifest.json";

fetch(manifestUrl)
  .then(response => response.json())
  .then(manifest => {

    const tileSources = manifest.items.map(canvas => {
      const body = canvas.items[0].items[0].body; // AnnotationPage -> Annotation -> body
      return {
        type: "image",
        url: body.id,
        width: body.width,
        height: body.height
      };
    });

    console.log(tileSources);

    const viewer = OpenSeadragon({
      id: "viewer-container",
      tileSources: tileSources,
      sequenceMode: true,
      preserveViewport: true,
      initialPage: 0,
      minZoomLevel: 1,
      maxZoomLevel: 1,
      visibilityRatio: 1,
      panHorizontal: false,
      showNavigationControl: false,
      showSequenceControl: true,
      showReferenceStrip: true,
      referenceStripScroll: 'horizontal'
    });
  })
  .catch(error => console.error("Error loading IIIF manifest:", error));    </script>
</body>
</html>
