# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Build turtle from csvw

on:
  push:
    branches: [ "main" ]

permissions: write-all

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install Python dependencies
      run: pip install csvw-functions==0.0.0 rdflib
    - name: Run Build turtle from csvw script
      run: python scripts/create_turtle.py
    - name: Commit generated files
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add retro/heinsius/heinsius_01_GS158/products/
        git commit -m "Build turtle from csvw" || echo "No changes to commit"
        git push
    - name: Debug - list generated files
      run: |
        echo "Current directory:"
        pwd
        echo "Contents of retro/heinsius/heinsius_01_GS158/products/:"
        find retro/heinsius/heinsius_01_GS158/products/ -type f 2>&1 || echo "public/ does not exist"
        echo "Git status:"
        git status# start
