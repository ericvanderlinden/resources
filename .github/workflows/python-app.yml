# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]

permissions: write-all

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y libvips-dev
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install Python dependencies
      run: pip install pyvips pandas
    - name: Run conversion script
      run: python scripts/process_iiif.py
    - name: Debug - list generated files
      run: |
        echo "Current directory:"
        pwd
        echo "Contents of retro/heinsius/heinsius_01_GS158/public/:"
        find retro/heinsius/heinsius_01_GS158/public/ -type f 2>&1 || echo "public/ does not exist"
        echo "Git status:"
        git status
